name: Java CI with Maven and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      #  Step 1: Checkout code
      - uses: actions/checkout@v4

      #  Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build Spring Boot app (skip tests)
      - name: Build with Maven
        run: mvn -f ./backend/Neuro-Canteen-1/pom.xml clean package -DskipTests

      #  Step 4: Set up Docker Buildx (for modern builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #  Step 5: Log in to Docker registry
      # Use Docker Hub or your private registry
      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: praveen181
          password: Kabilan@1

      #  Step 6: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/Neuro-Canteen-1
          file: ./backend/Neuro-Canteen-1/Dockerfile
          push: true
          tags: neuro-canteen-backend:latest

      # (Optional) Step 7: Clean up Maven cache
      - name: Clean Maven cache
        run: mvn -f ./backend/Neuro-Canteen-1/pom.xml clean
